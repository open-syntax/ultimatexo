[workspace]
resolver = "2"
members = ["crates/core", "crates/ai", "crates/services", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal dependencies
ultimatexo-core = { path = "crates/core" }
ultimatexo-ai = { path = "crates/ai" }
ultimatexo-services = { path = "crates/services" }

# External dependencies
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures-util = "0.3.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
tower_governor = { version = "0.8", features = ["axum", "tracing"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v4"] }
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.33.1", features = [
  "trace",
  "logs",
  "http-proto",
  "http-json",
  "reqwest-blocking-client",
  "reqwest-rustls",
] }
tracing-opentelemetry = "0.34.0"
opentelemetry-appender-tracing = "0.33.1"
chrono = "0.4.45"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
] }
